<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="emblemGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#E8A317"/>
      <stop offset="100%" stop-color="#C1860A"/>
    </linearGradient>
    <linearGradient id="laurelGreenLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FA66B"/>
      <stop offset="100%" stop-color="#1E6B3C"/>
    </linearGradient>
    <linearGradient id="oceanBlueLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5CA6EB"/>
      <stop offset="100%" stop-color="#1E4E79"/>
    </linearGradient>
    <linearGradient id="sunSkyLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="100%" stop-color="#F28E2B"/>
    </linearGradient>
  </defs>

  <!-- Left Emblem Group (X=10 to 130, Center=70, Y=70) -->
  <g transform="translate(10, 8)">
    <!-- Laurel Wreath Leaves (Left) -->
    <path d="M 50,110 C 25,100 15,75 22,50 C 26,40 32,30 42,24 C 40,32 42,42 48,50 C 38,62 38,82 50,96 Z" fill="url(#laurelGreenLight)" stroke="#0E381E" stroke-width="0.8"/>
    <!-- Laurel Wreath Leaves (Right) -->
    <path d="M 70,110 C 95,100 105,75 98,50 C 94,40 88,30 78,24 C 80,32 78,42 72,50 C 82,62 82,82 70,96 Z" fill="url(#laurelGreenLight)" stroke="#0E381E" stroke-width="0.8"/>
    
    <!-- Red Floral Berries on Wreath -->
    <circle cx="20" cy="58" r="3.5" fill="#E03131"/>
    <circle cx="26" cy="42" r="3.5" fill="#E03131"/>
    <circle cx="36" cy="30" r="3.5" fill="#E03131"/>
    <circle cx="100" cy="58" r="3.5" fill="#E03131"/>
    <circle cx="94" cy="42" r="3.5" fill="#E03131"/>
    <circle cx="84" cy="30" r="3.5" fill="#E03131"/>

    <!-- Top Crown / Kalasha Fan Motif -->
    <path d="M 60,8 C 50,10 44,18 44,26 C 52,24 60,20 60,8 Z" fill="#E03131" stroke="#E8A317" stroke-width="0.8"/>
    <path d="M 60,8 C 70,10 76,18 76,26 C 68,24 60,20 60,8 Z" fill="#E03131" stroke="#E8A317" stroke-width="0.8"/>
    <path d="M 52,26 C 56,16 60,10 60,8 C 60,10 64,16 68,26 Z" fill="#2D7A4D" stroke="#E8A317" stroke-width="0.8"/>
    <circle cx="60" cy="6" r="3" fill="#E8A317"/>

    <!-- Main Gold Ring -->
    <circle cx="60" cy="65" r="34" fill="url(#emblemGoldLight)" stroke="#B87B05" stroke-width="1.2"/>
    <circle cx="60" cy="65" r="28" fill="#FFFFFF" stroke="#B87B05" stroke-width="0.8"/>

    <!-- Inner Shield Scene -->
    <g clip-path="url(#innerCircleClipLight)">
      <clipPath id="innerCircleClipLight">
        <circle cx="60" cy="65" r="27"/>
      </clipPath>
      <rect x="30" y="35" width="60" height="35" fill="url(#sunSkyLight)"/>
      <path d="M 60,56 L 45,40 M 60,56 L 52,38 M 60,56 L 60,36 M 60,56 L 68,38 M 60,56 L 75,40" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="60" cy="56" r="8" fill="#FFF2B2" stroke="#E87817" stroke-width="0.8"/>
      <path d="M 32,64 Q 48,52 60,58 Q 72,52 88,64 L 88,72 L 32,72 Z" fill="#9E6700"/>
      <rect x="30" y="64" width="60" height="30" fill="url(#oceanBlueLight)"/>
      <path d="M 33,68 Q 45,64 60,68 Q 75,72 87,68" stroke="#FFFFFF" stroke-width="1" fill="none"/>
      <path d="M 33,74 Q 45,70 60,74 Q 75,78 87,74" stroke="#FFFFFF" stroke-width="1" fill="none"/>
    </g>

    <!-- Ring Legend: MANGALORE UNIVERSITY -->
    <path id="ringPathLight" d="M 35,65 A 25,25 0 1,1 85,65" fill="none"/>
    <text font-family="'Cinzel', 'Times New Roman', serif" font-size="5" font-weight="700" fill="#0B2A4A" letter-spacing="0.12em">
      <textPath href="#ringPathLight" startOffset="50%" text-anchor="middle">
        MANGALORE UNIVERSITY
      </textPath>
    </text>

    <!-- Bottom Ribbon with Motto -->
    <g transform="translate(60, 108)">
      <line x1="-15" y1="12" x2="15" y2="18" stroke="#144A29" stroke-width="2"/>
      <line x1="15" y1="12" x2="-15" y2="18" stroke="#144A29" stroke-width="2"/>
      <path d="M -38,0 L -46,-7 L -36,-12 L 36,-12 L 46,-7 L 38,0 L 44,7 L -44,7 Z" fill="#E8F4FA" stroke="#0B2A4A" stroke-width="0.8"/>
      <path d="M -36,0 L 36,0 L 32,5 L -32,5 Z" fill="#D0E7F5"/>
      <text x="0" y="-3" font-family="'Noto Serif Kannada', 'Segoe UI', 'Tunga', serif" font-size="7.5" font-weight="700" fill="#0B2A4A" text-anchor="middle">
        ಜ್ಞಾನವೇ ಬೆಳಕು
      </text>
    </g>
  </g>

  <!-- Right Typography Group (White / Light Mode for Dark Header & Footer) -->
  <g transform="translate(142, 20)">
    <!-- Kannada Script Header in Gold (#E8A317) -->
    <text x="0" y="30" font-family="'Noto Serif Kannada', 'Anek Kannada', 'Tunga', 'Segoe UI', serif" font-size="28" font-weight="700" fill="#E8A317" letter-spacing="0.02em">
      ಮಂಗಳೂರು ವಿಶ್ವವಿದ್ಯಾನಿಲಯ
    </text>

    <!-- English Wordmark in Crisp White (#FFFFFF) -->
    <text x="0" y="66" font-family="'Cinzel', 'Fraunces', 'Times New Roman', Georgia, serif" font-size="29" font-weight="700" fill="#FFFFFF" letter-spacing="0.06em">
      MANGALORE UNIVERSITY
    </text>

    <!-- Tagline / Accreditation Subtitle -->
    <g transform="translate(2, 92)">
      <text x="0" y="0" font-family="'Libre Franklin', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-transform="uppercase" letter-spacing="0.16em" fill="rgba(255,255,255,0.75)">
        MANGALAGANGOTHRI - 574 199
      </text>
      <text x="260" y="0" font-family="'Cinzel', 'Libre Franklin', serif" font-size="12" font-weight="700" fill="#E8A317" letter-spacing="0.25em">
        NAAC  A++
      </text>
    </g>
  </g>
</svg>
